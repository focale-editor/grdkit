name: grdkit
description: A pure Dart codec for Adobe Photoshop GRD gradient libraries.
version: 0.1.0
homepage: https://github.com/focale-editor/grdkit
repository: https://github.com/focale-editor/grdkit

topics:
  - photoshop
  - gradients
  - color
  - codec
  - file-format

screenshots:
  - description: 'A gradient ramp with color stops representing Photoshop GRD libraries.'
    path: screenshots/overview.png

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  pscore: '>=0.1.6 <0.2.0'

dev_dependencies:
  analyzer: ^14.5.0
  checks: ^0.3.2
  lints: ^6.1.0
  release: ^0.1.11
  test: ^1.32.0

release:
  changelog:
    header: '# 📰 GrdKit changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
